<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<title>Speed Stack Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="logo" aria-hidden="true">
    <svg viewBox="0 0 64 56" width="38" height="34"><g stroke="#1b1446" stroke-width="2" stroke-linejoin="round">
      <path d="M2 54l5-20h18l5 20z" fill="#ff4d6d"/><path d="M34 54l5-20h18l5 20z" fill="#ffc531"/>
      <path d="M18 32l5-20h18l5 20z" fill="#2ee6a6" transform="translate(0 0)"/>
      <path d="M26 12l4-10h4l4 10z" fill="#4cc9ff"/></g></svg>
  </div>
  <select id="event" aria-label="Épreuve">
    <option value="3-3-3">3-3-3</option>
    <option value="3-6-3">3-6-3</option>
    <option value="Cycle">Cycle</option>
  </select>
  <select id="mode" aria-label="Mode">
    <option value="phone">Cellulaire</option>
    <option value="tablet2">Tablette 2 mains</option>
    <option value="tablet1">Tablette 1 main</option>
  </select>
  <button id="comp" aria-pressed="false" title="Mode compétition : 3 essais">🏁 Compét.</button>
  <nav>
    <button id="tab-timer" class="on">Chrono</button>
    <button id="tab-stats">Records</button>
    <button id="tab-opts" aria-label="Options" title="Options">⚙</button>
  </nav>
</header>

<main id="view-timer">
  <div id="pads">
    <div class="pad" id="padL"></div>
    <div class="pad" id="padR"></div>
  </div>
  <div id="info">
    <div id="time">0.000</div>
    <div id="hint"></div>
    <div id="round"></div>
  </div>
</main>

<main id="view-stats" hidden>
  <section id="records"></section>
  <h2>Historique <span id="hist-event"></span></h2>
  <ul id="history"></ul>
  <div class="row">
    <button id="export">Exporter</button>
    <button id="clear" class="danger">Tout effacer</button>
  </div>
</main>
<main id="view-opts" hidden>
  <h2>Sons</h2>
  <div class="opt">
    <label for="o-sound">Sons activés</label>
    <input type="checkbox" id="o-sound" class="switch">
  </div>
  <div class="opt">
    <label for="o-vol">Volume</label>
    <input type="range" id="o-vol" min="0" max="100" step="5">
    <output id="o-vol-v">70</output>
  </div>
  <div class="opt">
    <label for="o-theme">Type de son</label>
    <select id="o-theme">
      <option value="arcade">Arcade (bips)</option>
      <option value="doux">Doux</option>
      <option value="cloche">Cloche</option>
      <option value="chrono">Chronomètre</option>
    </select>
  </div>
  <div class="row"><button id="o-test">▶ Tester les sons</button></div>
</main>
<script src="app.js"></script>
</body>
</html>
